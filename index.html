<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<title>Freya's iPhone</title>
<style>
:root{--bg:#090a0d;--panel:#17181e;--muted:#a4a5ae;--line:#ffffff20;--accent:#d7d5dc;--pink:#e7b9c8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#35343b 0,#101115 38%,#07080a 100%);color:#f8f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}
.phone{width:min(390px,100%);height:min(820px,calc(100dvh - 24px));min-height:650px;border:2px solid #6d6d73;border-radius:48px;background:#050507;padding:10px;box-shadow:0 30px 90px #000b,0 0 0 1px #ffffff16;position:relative}
.screen{height:100%;border-radius:37px;overflow:hidden;position:relative;background:#15151b}
.wallpaper{position:absolute;inset:0;background:linear-gradient(180deg,#0002,#0007),url('assets/freya-1.jpg') center 27%/cover;filter:saturate(.82)}
.status{position:absolute;z-index:5;top:12px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:12px;font-weight:650;text-shadow:0 1px 5px #000}
.island{position:absolute;z-index:6;top:9px;left:50%;transform:translateX(-50%);width:105px;height:28px;background:#050506;border-radius:20px}
.lock{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:72px;text-align:center;background:linear-gradient(#0001,#0003 50%,#0008)}
.date{font-size:14px;color:#f5f3f5;text-shadow:0 1px 8px #000}
.clock{font-size:76px;letter-spacing:-4px;font-weight:250;line-height:1.12;text-shadow:0 2px 18px #0005}
.lockhint{margin-top:auto;margin-bottom:18px;font-size:12px;color:#fff;opacity:.9}
.lockbuttons{display:flex;justify-content:space-between;width:100%;padding:0 25px 22px}
.roundbtn{border:1px solid #ffffff55;background:#ffffff20;backdrop-filter:blur(15px);width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:white}
.home{position:absolute;z-index:2;inset:0;display:none;background:linear-gradient(#0002,#0007),url('assets/freya-1.jpg') center/cover}
.home::before{content:"";position:absolute;inset:0;background:linear-gradient(#0001,#0005)}
.homecontent{position:relative;height:100%;padding:58px 19px 22px;display:flex;flex-direction:column}
.welcome{font-size:12px;letter-spacing:1.7px;font-weight:700;text-shadow:0 2px 8px #000;margin-bottom:7px}
.subwelcome{font-size:11px;color:#eee;text-shadow:0 2px 8px #000;margin-bottom:23px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 9px}
.app{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;text-shadow:0 1px 5px #000;cursor:pointer;padding:0}
.appicon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:#ffffffd9;color:#222;box-shadow:0 4px 14px #0004;text-shadow:none;overflow:hidden}
.appicon img{width:100%;height:100%;object-fit:cover}
.messages{background:linear-gradient(145deg,#c2e8d1,#65bd8c)}.photos{background:conic-gradient(#f6cb55,#e88191,#9a8bea,#66c8e0,#f6cb55)}.phoneapp{background:#4fca77;color:white}.music{background:linear-gradient(145deg,#fa93b8,#8e59d8);color:white}.notes{background:linear-gradient(#f8df6a 0 25%,#fff 25%);}.safari{background:linear-gradient(145deg,#b9e9ff,#4589ef);color:#1655b5}.settings{background:linear-gradient(145deg,#b7bbc3,#626875);color:white}.facetime{background:#63d59a;color:white}
.dock{margin-top:auto;padding:12px 12px 7px;border:1px solid #ffffff2b;background:#ffffff2c;backdrop-filter:blur(18px);border-radius:25px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.dock .appicon{width:49px;height:49px}
.homebar{height:4px;width:105px;background:#fff;border-radius:9px;margin:13px auto 0;box-shadow:0 1px 3px #000}
.appview{display:none;position:absolute;z-index:8;inset:0;background:#f5f5f8;color:#16161a;border-radius:36px;overflow:hidden}
.apphead{height:58px;padding:22px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;font-weight:700;background:#f7f7fa}
.back{border:0;background:none;color:#2584ff;font-size:14px;cursor:pointer}
.appbody{height:calc(100% - 58px);overflow:auto;padding:16px}
.search{width:100%;padding:11px 12px;border:0;border-radius:11px;background:#e7e7ec;font-size:14px;margin-bottom:14px}
.contact{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #ddd}
.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#ddd;flex-shrink:0;display:grid;place-items:center;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover}
.small{font-size:12px;color:#73737b;margin-top:4px}
.chatbubble{max-width:84%;padding:10px 13px;border-radius:18px;margin:10px 0;font-size:14px;line-height:1.35}
.sent{background:#2788ff;color:#fff;margin-left:auto;border-bottom-right-radius:5px}.received{background:#e4e4e9;color:#17171b;border-bottom-left-radius:5px}
.chatinput{display:flex;gap:7px;margin-top:15px}.chatinput input{min-width:0;flex:1;border:1px solid #ddd;border-radius:18px;padding:10px}.chatinput button,.bluebtn{border:0;border-radius:18px;padding:10px 14px;background:#1684ff;color:white}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.gallery img{width:100%;height:190px;object-fit:cover;border-radius:8px;cursor:pointer}
.photo-full{position:absolute;inset:0;background:#08080a;display:none;z-index:12;align-items:center;justify-content:center;flex-direction:column;padding:15px}.photo-full img{max-width:100%;max-height:80%;object-fit:contain}.photo-full button{margin-top:18px}
.note{width:100%;min-height:190px;border:0;resize:vertical;background:#fff6c8;padding:15px;border-radius:10px;font:16px/1.5 -apple-system,sans-serif}
.settingrow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #ddd}.pill{font-size:12px;color:#6c6c74;background:#e8e8ec;padding:5px 8px;border-radius:9px}
.callcard{text-align:center;padding-top:55px}.callpic{width:100px;height:100px;border-radius:50%;object-fit:cover}.callname{font-size:25px;margin:18px 0 5px}.callstatus{color:#666;font-size:14px}.callactions{display:flex;justify-content:center;gap:25px;margin-top:80px}.callactions button{width:55px;height:55px;border:0;border-radius:50%;font-size:23px;color:#fff;background:#5cc979}.callactions .end{background:#ff4c4c}
.browserbox{padding:10px;border:1px solid #ddd;border-radius:13px;color:#666;font-size:13px;margin-bottom:20px}.browserhero{text-align:center;padding:35px 5px}.browserhero img{width:90px;height:90px;border-radius:50%;object-fit:cover}
@media(max-height:700px){.phone{min-height:0;height:calc(100dvh - 16px)}.clock{font-size:64px}.apps{gap:13px 8px}.appicon{width:46px;height:46px}.dock .appicon{width:43px;height:43px}}
</style>
</head>
<body>
<div class="phone"><div class="screen" id="screen">
<div class="wallpaper"></div>
<div class="status"><span id="statusTime">9:41</span><span>● ▰ ▰</span></div><div class="island"></div>
<section class="lock" id="lock">
<div class="date" id="dateText">Kamis, 22 Oktober</div><div class="clock" id="clockText">9:41</div>
<div class="lockhint">Ketuk dua kali untuk membuka</div>
<div class="lockbuttons"><button class="roundbtn" onclick="openApp('camera')">◉</button><button class="roundbtn" onclick="unlock()">↑</button></div>
</section>
<section class="home" id="home"><div class="homecontent">
<div class="welcome">FREYA'S IPHONE</div><div class="subwelcome">A little world of Freya ♡</div>
<div class="apps">
<button class="app" onclick="openApp('messages')"><span class="appicon messages">●</span>Messages</button>
<button class="app" onclick="openApp('photos')"><span class="appicon photos">🌈</span>Photos</button>
<button class="app" onclick="openApp('phone')"><span class="appicon phoneapp">☎</span>Phone</button>
<button class="app" onclick="openApp('music')"><span class="appicon music">♫</span>Music</button>
<button class="app" onclick="openApp('notes')"><span class="appicon notes">▤</span>Notes</button>
<button class="app" onclick="openApp('safari')"><span class="appicon safari">🧭</span>Safari</button>
<button class="app" onclick="openApp('settings')"><span class="appicon settings">⚙</span>Settings</button>
<button class="app" onclick="openApp('facetime')"><span class="appicon facetime">▣</span>FaceTime</button>
</div>
<div class="dock">
<button class="app" onclick="openApp('phone')"><span class="appicon phoneapp">☎</span></button>
<button class="app" onclick="openApp('messages')"><span class="appicon messages">●</span></button>
<button class="app" onclick="openApp('photos')"><span class="appicon photos">🌈</span></button>
<button class="app" onclick="openApp('music')"><span class="appicon music">♫</span></button>
</div><div class="homebar"></div>
</div></section>
<div class="appview" id="appview"><div class="apphead"><button class="back" onclick="closeApp()">‹ Home</button><span id="appTitle">App</span><span style="width:42px"></span></div><div class="appbody" id="appbody"></div></div>
<div class="photo-full" id="photoFull"><img id="fullImg" src="" alt="Foto Freya"><button class="bluebtn" onclick="closeFullPhoto()">Tutup</button></div>
</div></div>
<script>
const photos=['assets/freya-1.jpg','assets/freya-2.jpg','assets/freya-3.jpg','assets/freya-4.jpg','assets/freya-5.jpg','assets/freya-6.jpg'];
const titles={messages:'Messages',photos:'Photos',phone:'Phone',music:'Music',notes:'Notes',safari:'Safari',settings:'Settings',facetime:'FaceTime',camera:'Camera'};
let currentApp='',messages=[{who:'Freya',text:'Haii! Lagi ngapain? ♡',side:'received'},{who:'Kamu',text:'Lagi lihat foto kamu hehe',side:'sent'},{who:'Freya',text:'Ih, apaan sih 😳',side:'received'}];
function updateClock(){const d=new Date();let h=d.getHours()%12||12,m=String(d.getMinutes()).padStart(2,'0');document.getElementById('clockText').textContent=`${h}:${m}`;document.getElementById('statusTime').textContent=`${h}:${m}`;document.getElementById('dateText').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});}
updateClock();setInterval(updateClock,15000);
function unlock(){document.getElementById('lock').style.display='none';document.getElementById('home').style.display='block'}
document.getElementById('lock').addEventListener('dblclick',unlock);
function openApp(name){if(name==='camera'){name='photos'}currentApp=name;document.getElementById('appTitle').textContent=titles[name]||name;const body=document.getElementById('appbody');body.innerHTML='';
if(name==='photos'){body.innerHTML='<p class="small">Semua foto • Freya</p><div class="gallery">'+photos.map((p,i)=>`<img src="${p}" alt="Foto Freya ${i+1}" onclick="showPhoto('${p}')">`).join('')+'</div>'}
else if(name==='messages'){body.innerHTML='<div class="contact"><div class="avatar"><img src="'+photos[0]+'"></div><div><b>Freya ♡</b><div class="small">iMessage • sekarang</div></div></div><div id="chat">'+messages.map(m=>`<div class="chatbubble ${m.side}">${escapeHtml(m.text)}</div>`).join('')+'</div><div class="chatinput"><input id="chatText" placeholder="iMessage" onkeydown="if(event.key===\'Enter\')sendMessage()"><button onclick="sendMessage()">Kirim</button></div>'}
else if(name==='phone'||name==='facetime'){body.innerHTML=`<div class="callcard"><img class="callpic" src="${photos[0]}"><div class="callname">Freya ♡</div><div class="callstatus" id="callStatus">Simulasi panggilan</div><div class="callactions"><button onclick="document.getElementById('callStatus').textContent='Memanggil Freya…'">☎</button><button class="end" onclick="document.getElementById('callStatus').textContent='Panggilan berakhir'">✕</button></div><p class="small">Panggilan ini hanya simulasi, bukan panggilan sungguhan.</p></div>`}
else if(name==='music'){body.innerHTML='<div style="text-align:center;padding:22px 8px"><img src="'+photos[1]+'" style="width:210px;height:210px;object-fit:cover;border-radius:14px;box-shadow:0 8px 25px #0002"><h2>Freya — Your Playlist</h2><p class="small">Playlist fan-made ♡</p><div class="settingrow"><span>♡ Favorite moments</span><button class="bluebtn" onclick="togglePlay(this)">▶</button></div><div class="settingrow"><span>Dreamy day</span><span class="pill">Demo</span></div><div class="settingrow"><span>Little star</span><span class="pill">Demo</span></div><p class="small">Kontrol pemutar demo; belum memutar audio sungguhan.</p></div>'}
else if(name==='notes'){body.innerHTML='<p class="small">Catatan tersimpan di perangkat ini selama halaman tidak dimuat ulang.</p><textarea id="noteText" class="note" placeholder="Tulis catatan..."></textarea><button class="bluebtn" style="margin-top:12px" onclick="saveNote()">Simpan catatan</button><span id="noteSaved" class="small"></span>';document.getElementById('noteText').value=localStorage.getItem('freya-note')||''}
else if(name==='settings'){body.innerHTML='<div class="contact"><div class="avatar"><img src="'+photos[0]+'"></div><div><b>Freya’s iPhone</b><div class="small">iOS-inspired fan project</div></div></div><div class="settingrow"><span>Wallpaper</span><button class="bluebtn" onclick="changeWallpaper()">Ganti</button></div><div class="settingrow"><span>Mode</span><span class="pill">Dark aesthetic</span></div><div class="settingrow"><span>Nama perangkat</span><span>Freya ♡</span></div><div class="settingrow"><span>Versi</span><span>1.0 demo</span></div><p class="small">Website fan-made, bukan produk resmi Apple atau akun resmi Freya.</p>'}
else if(name==='safari'){body.innerHTML='<div class="browserbox">⌕  Cari atau masukkan alamat</div><div class="browserhero"><img src="'+photos[2]+'"><h2>Freya’s little corner</h2><p class="small">A tiny fan-made space dedicated to Freya.</p><button class="bluebtn" onclick="openApp(\'photos\')">Lihat galeri</button></div>'}
else {body.innerHTML='<div style="text-align:center;padding:45px 10px"><img src="'+photos[0]+'" style="width:100px;height:100px;border-radius:50%;object-fit:cover"><h2>Camera</h2><p class="small">Kamera sungguhan tidak dapat diakses dari demo ini.</p></div>'}
document.getElementById('appview').style.display='block'}
function closeApp(){document.getElementById('appview').style.display='none';currentApp=''}
function showPhoto(p){document.getElementById('fullImg').src=p;document.getElementById('photoFull').style.display='flex'}
function closeFullPhoto(){document.getElementById('photoFull').style.display='none'}
function sendMessage(){const el=document.getElementById('chatText');if(!el||!el.value.trim())return;messages.push({who:'Kamu',text:el.value.trim(),side:'sent'});const chat=document.getElementById('chat');chat.insertAdjacentHTML('beforeend','<div class="chatbubble sent">'+escapeHtml(el.value.trim())+'</div>');el.value='';chat.scrollTop=chat.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveNote(){localStorage.setItem('freya-note',document.getElementById('noteText').value);document.getElementById('noteSaved').textContent=' • Tersimpan ✓'}
function togglePlay(btn){btn.textContent=btn.textContent==='▶'?'Ⅱ':'▶'}
function changeWallpaper(){const w=document.querySelector('.wallpaper');let i=Number(w.dataset.i||0)+1;w.dataset.i=i;w.style.backgroundImage=`linear-gradient(180deg,#0002,#0007),url('${photos[i%photos.length]}')`;document.querySelector('.home').style.backgroundImage=`linear-gradient(#0002,#0007),url('${photos[i%photos.length]}')`}
</script>
</body></html>
